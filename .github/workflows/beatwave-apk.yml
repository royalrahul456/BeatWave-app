name: Build Beatwave APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug
      abi:
        description: 'Target ABI'
        required: true
        default: 'arm64'
        type: choice
        options:
          - arm64
          - universal
  push:
    branches: [ 'main', 'master' ]
    paths-ignore:
      - 'README.md'
      - 'fastlane/**'
      - 'assets/**'
      - '.github/**/*.md'

permissions:
  contents: read

concurrency:
  group: beatwave-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Build Beatwave APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Set up JDK 27
        uses: actions/setup-java@v6
        with:
          java-version: '27'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-cleanup: on-success

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Beatwave APKs
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          ABI: ${{ github.event.inputs.abi || 'arm64' }}
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
          API_BEARER_TOKEN: ${{ secrets.API_BEARER_TOKEN }}
          TOGETHER_BEARER_TOKEN: ${{ secrets.TOGETHER_BEARER_TOKEN }}
          CANVAS_BEARER_TOKEN: ${{ secrets.CANVAS_BEARER_TOKEN }}
          EXTRACTOR_BEARER: ${{ secrets.EXTRACTOR_BEARER }}
        run: |
          set -euo pipefail
          ABI_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${ABI:0:1}")${ABI:1}"
          BUILD_CAP="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_TYPE:0:1}")${BUILD_TYPE:1}"
          TASK="assembleGmsMobile${ABI_CAP}${BUILD_CAP}"
          echo "Running Gradle task: $TASK"
          ./gradlew "$TASK" \
            --max-workers=2 \
            -Dkotlin.daemon.jvmargs="-Xmx5120m -Djava.awt.headless=true -XX:+UseG1GC"

      - name: Sign and collect APKs
        shell: bash
        env:
          BUILD_TYPE: ${{ github.event.inputs.build_type || 'release' }}
          BUILD_TOOLS_VERSION: 35.0.0
          KEYSTORE_B64: ${{ secrets.KEYSTORE }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASS_INPUT: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p beatwave-apks

          if [ "$BUILD_TYPE" = "debug" ]; then
            find app/build/outputs/apk -type f -name "*.apk" | while read -r apk; do
              name="$(basename "$apk")"
              cp "$apk" "beatwave-apks/Beatwave-${name}"
            done
          else
            BUILD_TOOLS="${ANDROID_HOME:-$ANDROID_SDK_ROOT}/build-tools/${BUILD_TOOLS_VERSION}"
            KEYSTORE_FILE="$RUNNER_TEMP/beatwave.keystore"
            trap 'rm -f "$KEYSTORE_FILE"' EXIT

            if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEY_ALIAS:-}" ] && [ -n "${STORE_PASS:-}" ]; then
              printf '%s' "$KEYSTORE_B64" | sed '/^-----/d' | tr -d '[:space:]' | base64 -d > "$KEYSTORE_FILE"
              KEY_PASS="${KEY_PASS_INPUT:-$STORE_PASS}"
            else
              echo "No signing secrets configured; generating temporary Beatwave signing keystore."
              KEY_ALIAS="beatwave"
              STORE_PASS="beatwave-build"
              KEY_PASS="beatwave-build"
              keytool -genkeypair -v \
                -keystore "$KEYSTORE_FILE" \
                -storetype PKCS12 \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias "$KEY_ALIAS" \
                -storepass "$STORE_PASS" \
                -keypass "$KEY_PASS" \
                -dname "CN=Beatwave, OU=Mobile, O=Beatwave, L=Unknown, ST=Unknown, C=US"
            fi
            export STORE_PASS KEY_PASS

            find app/build/outputs/apk -type f -name "*.apk" | sort | while read -r apk; do
              base="$(basename "$apk")"
              if [[ "$base" == *-unsigned.apk ]]; then
                aligned="${apk%.apk}-aligned.apk"
                signed="beatwave-apks/Beatwave-${base%-unsigned.apk}.apk"
                if "$BUILD_TOOLS/zipalign" -c 4 "$apk" > /dev/null 2>&1; then
                  cp "$apk" "$aligned"
                else
                  "$BUILD_TOOLS/zipalign" -f -P 16 4 "$apk" "$aligned"
                fi
                "$BUILD_TOOLS/apksigner" sign \
                  --ks "$KEYSTORE_FILE" \
                  --ks-key-alias "$KEY_ALIAS" \
                  --ks-pass env:STORE_PASS \
                  --key-pass env:KEY_PASS \
                  --out "$signed" \
                  "$aligned"
                rm -f "$aligned" "${signed}.idsig"
                "$BUILD_TOOLS/apksigner" verify "$signed"
              else
                cp "$apk" "beatwave-apks/Beatwave-${base}"
              fi
            done
          fi

          ls -lh beatwave-apks/

      - name: Upload Beatwave APKs
        uses: actions/upload-artifact@v7
        with:
          name: Beatwave-APKs
          path: beatwave-apks/*.apk
          retention-days: 30
